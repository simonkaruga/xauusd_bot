version: '3.9'

services:

  bot:
    build: .
    container_name: xauusd_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./logs:/app/logs          # persist trade DB and logs
    command: python main.py
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('logs/trading_bot.log') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    build: .
    container_name: xauusd_dashboard
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./logs:/app/logs          # shared with bot container
    ports:
      - "5000:5000"
    command: python dashboard.py
    depends_on:
      - bot

  backtester:
    build: .
    container_name: xauusd_backtester
    env_file: .env
    volumes:
      - ./logs:/app/logs
    command: python backtester.py
    profiles:
      - tools              # only runs with: docker-compose --profile tools up backtester

  optimizer:
    build: .
    container_name: xauusd_optimizer
    env_file: .env
    volumes:
      - ./logs:/app/logs
    command: python walk_forward_optimizer.py
    profiles:
      - tools

volumes: {}
